[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-iam-least-privilege-audit-cli-lite"
version = "0.1.0"
description = "Zero-dependency Python 3.9+ CLI for auditing AWS IAM, Trust, and S3 Bucket Policy JSONs for least-privilege violations."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["aws", "iam", "security", "least-privilege", "audit", "s3-policy", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.scripts]
iam-audit = "iam_audit.cli:main"

[tool.setuptools.packages.find]
include = ["iam_audit*"]
